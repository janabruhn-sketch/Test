<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Apps</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"DM Sans",sans-serif; background:#F8F5F0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
        .container { max-width:400px; width:100%; }
        h1 { font-family:"Playfair Display",serif; font-size:28px; text-align:center; color:#2c2c2c; margin-bottom:28px; }
        .card { display:flex; align-items:center; gap:18px; background:#fff; border-radius:20px; padding:22px 24px; margin-bottom:16px; text-decoration:none; color:inherit; box-shadow:0 2px 12px rgba(0,0,0,0.05); border:1.5px solid #f0ece8; transition:transform 0.15s,box-shadow 0.15s; }
        .card:active { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.09); }
        .icon { width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .icon-rezept { background:linear-gradient(135deg,#E76F51,#F4A261); box-shadow:0 4px 14px rgba(231,111,81,0.27); }
        .icon-smoke { background:linear-gradient(135deg,#1a1a2e,#0f3460); box-shadow:0 4px 14px rgba(26,26,46,0.27); }
        .icon svg { width:32px; height:32px; }
        .info h2 { font-family:"Playfair Display",serif; font-size:19px; color:#2c2c2c; margin-bottom:2px; }
        .info p { font-size:13px; color:#999; }
    </style>
</head>
<body>
<div class="container">
    <h1>Meine Apps</h1>
    <a class="card" href="rezeptbuch/">
        <div class="icon icon-rezept">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="5" width="24" height="22" rx="3" stroke="white" stroke-width="2"/>
                <line x1="16" y1="5" x2="16" y2="27" stroke="white" stroke-width="1.5"/>
                <line x1="10" y1="10" x2="10" y2="15" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="8.5" y1="10" x2="8.5" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="11.5" y1="10" x2="11.5" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M8.5 13.5 Q10 15 11.5 13.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <ellipse cx="22" cy="11.5" rx="2" ry="2.5" stroke="white" stroke-width="1.5"/>
                <line x1="22" y1="14" x2="22" y2="22" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="info">
            <h2>Rezeptbuch</h2>
            <p>Deine Rezepte mit Portionsrechner</p>
        </div>
    </a>
    <a class="card" href="smokelog/">
        <div class="icon icon-smoke">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="18" width="16" height="8" rx="2" stroke="white" stroke-width="2"/>
                <line x1="12" y1="18" x2="12" y2="26" stroke="white" stroke-width="1"/>
                <path d="M14 14 Q14 10 16 10 Q18 10 18 14" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M18 14 Q18 10 20 8" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="info">
            <h2>Smoke Log</h2>
            <p>Zigaretten Tracker</p>
        </div>
    </a>
</div>
</body>
</html>
